name: Deploy backend

# Runs only after Test succeeds on master — never deploys code that hasn't
# passed the suite. Requires a RAILWAY_TOKEN repo secret (a Railway Project
# Token scoped to this project's production environment, generated in the
# Railway dashboard — see README.md's "Deploying" section).
on:
  workflow_run:
    workflows: [Test]
    branches: [master]
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service b7c4e8a0-1a29-4627-b585-2e6a888e41eb --detach
